name: LINE Phase 3 isolated tests

# Read-only PR and manual checks: never deploys, sends LINE, applies migrations, or uses secrets.
on:
  pull_request:
    branches:
      - cursor/line-automation-phase-2a-schedule-7c7d
    paths:
      - 'lib/line/automations/**'
      - 'supabase/migrations/20261023*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/line-phase3-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      LINE_AUTOMATION_SEND_OPEN: "false"
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The existing lockfile has a picomatch hoisting inconsistency.
      # Use a disposable runner-only resolution; do not rewrite the lockfile
      # or alter production dependencies in this isolated test workflow.
      - name: Install dependencies in isolated runner
        id: install
        run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund
      - name: Generate Next.js route types without building or deploying
        run: npx next typegen
      - name: Parse Phase 3 SQL migrations without database access
        run: |
          python -m pip install --disable-pip-version-check --quiet 'pglast==7.20'
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          paths = [
              Path("supabase/migrations/20261023110000_line_automation_birthday_fingerprint_v2_helper.sql"),
              Path("supabase/migrations/20261023120000_line_automation_birthday_annual_schedule_contract.sql"),
          ]
          for path in paths:
              statements = parse_sql(path.read_text(encoding="utf-8"))
              print(f"{path.name}: parsed {len(statements)} PostgreSQL statements")
          PY
      - name: TypeScript static check
        run: npx tsc --noEmit
      - name: Run Phase 3 isolation suite
        if: always() && steps.install.outcome == 'success'
        run: npm run test:line-phase3
