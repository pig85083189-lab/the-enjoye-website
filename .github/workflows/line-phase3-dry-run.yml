name: LINE Phase 3 isolated tests

# Read-only PR and manual checks: never deploys, sends LINE, applies migrations, or uses secrets.
on:
  pull_request:
    branches:
      - cursor/line-automation-phase-2a-schedule-7c7d
    paths:
      - 'lib/line/automations/**'
      - 'supabase/migrations/20261023*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/line-phase3-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      LINE_AUTOMATION_SEND_OPEN: "false"
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The existing lockfile has a picomatch hoisting inconsistency.
      # Use a disposable runner-only resolution; do not rewrite the lockfile
      # or alter production dependencies in this isolated test workflow.
      - name: Install dependencies in isolated runner
        id: install
        run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund
      - name: Generate Next.js route types without building or deploying
        run: npx next typegen
      - name: Parse Phase 3 SQL migrations without database access
        run: |
          python -m pip install --disable-pip-version-check --quiet 'pglast==7.20'
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          paths = [
              Path("supabase/migrations/20261023110000_line_automation_birthday_fingerprint_v2_helper.sql"),
              Path("supabase/migrations/20261023120000_line_automation_birthday_annual_schedule_contract.sql"),
          ]
          for path in paths:
              statements = parse_sql(path.read_text(encoding="utf-8"))
              print(f"{path.name}: parsed {len(statements)} PostgreSQL statements")
          PY
      - name: Verify birthday identity helper on disposable PostgreSQL
        run: |
          docker run --rm -d --name line-phase3-postgres -e POSTGRES_PASSWORD=localtest -e POSTGRES_DB=line_phase3_test postgres:16-alpine
          trap 'docker rm -f line-phase3-postgres >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec line-phase3-postgres psql -U postgres -d line_phase3_test -tAc 'SELECT 1' 2>/dev/null | grep -qx 1; then break; fi
            sleep 1
          done
          docker exec line-phase3-postgres psql -v ON_ERROR_STOP=1 -U postgres -d line_phase3_test -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          docker exec -i line-phase3-postgres psql -v ON_ERROR_STOP=1 -U postgres -d line_phase3_test < supabase/migrations/20261023110000_line_automation_birthday_fingerprint_v2_helper.sql
          docker exec -i line-phase3-postgres psql -v ON_ERROR_STOP=1 -U postgres -d line_phase3_test <<'SQL'
          DO $security$
          BEGIN
            IF has_function_privilege('anon', 'public.line_automation_birthday_fingerprint_v2(text,text,text,date)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.line_automation_birthday_fingerprint_v2(text,text,text,date)', 'EXECUTE')
            THEN
              RAISE EXCEPTION 'birthday helper unexpectedly exposed to API roles';
            END IF;
          END;
          $security$;
          SQL
          docker exec -i line-phase3-postgres psql -v ON_ERROR_STOP=1 -U postgres -d line_phase3_test <<'SQL'
          DO $test$
          DECLARE actual text;
          BEGIN
            SELECT public.line_automation_birthday_fingerprint_v2('org-test', 'customer-1', 'birthday_morning', '2027-02-28'::date) INTO actual;
            IF actual IS DISTINCT FROM 'org-test|birthday_greeting|customer-1|birthday_morning|2027' THEN
              RAISE EXCEPTION 'unexpected annual birthday identity: %', actual;
            END IF;
            SELECT public.line_automation_birthday_fingerprint_v2('org-test', 'customer-1', 'days_before_3', '2027-01-01'::date) INTO actual;
            IF actual IS DISTINCT FROM 'org-test|birthday_greeting|customer-1|days_before_3|2027' THEN
              RAISE EXCEPTION 'unexpected cross-year birthday identity: %', actual;
            END IF;
            BEGIN
              PERFORM public.line_automation_birthday_fingerprint_v2('org-test|bad', 'customer-1', 'birthday_morning', '2027-01-01'::date);
              RAISE EXCEPTION 'invalid organization was accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            BEGIN
              PERFORM public.line_automation_birthday_fingerprint_v2('org-test', 'customer-1', 'unknown', '2027-01-01'::date);
              RAISE EXCEPTION 'invalid timing was accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
          END;
          $test$;
          SQL
      - name: TypeScript static check
        run: npx tsc --noEmit
      - name: Run Phase 3 isolation suite
        if: always() && steps.install.outcome == 'success'
        run: npm run test:line-phase3
